<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Medicine MCQ Study App</title>
    <!-- LINK YOUR EXTERNAL CASES.JS FILE HERE -->
    <script src="cases.js"></script>
    <style>
        :root {
            --primary: #2980b9;
            --accent: #c0392b;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --card-bg: #ffffff;
            --success: #27ae60;
            --error: #c0392b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            color: var(--dark);
            font-size: 1.6rem;
        }
        header p {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin: 5px 0 0;
        }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .score-item span { font-weight: 700; }
        .score-correct { color: var(--success); }
        .score-incorrect { color: var(--error); }

        .flashcard {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            padding: 30px;
            margin-bottom: 20px;
            border-top: 5px solid var(--accent);
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #95a5a6;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .scenario-title {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .option-item {
            background: #f1f2f6;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }
        .option-item:hover:not(.disabled) { background: #dfe4ea; }
        .option-item.correct {
            background: rgba(39, 174, 96, 0.15);
            border-color: var(--success);
            color: #1e8449;
            font-weight: 600;
        }
        .option-item.incorrect {
            background: rgba(192, 57, 43, 0.15);
            border-color: var(--error);
            color: #922b21;
        }
        .option-item.disabled { cursor: default; }
        .rationale-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid var(--success);
            display: none;
        }
        .rationale-section.visible {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .rationale-section h4 {
            margin-top: 0;
            color: var(--success);
            font-size: 1rem;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            background-color: #bdc3c7;
            color: var(--dark);
        }
        .btn:hover { background-color: #95a5a6; }
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ EM Multiple-Choice Study Cards</h1>
        <p>Active Recall: Answer first, get instant pathophysiology rationales</p>
    </header>

    <div class="scoreboard">
        <div class="score-item">Correct: <span id="count-correct" class="score-correct">0</span></div>
        <div class="score-item">Incorrect: <span id="count-incorrect" class="score-incorrect">0</span></div>
        <div class="score-item">Answered: <span id="count-answered">0</span> / <span id="total-cards">0</span></div>
    </div>

    <div class="flashcard" id="card-element">
        <div class="card-meta">
            <span id="card-category">Loading...</span>
            <span id="card-counter">Card 0 of 0</span>
        </div>
        
        <div class="scenario-title" id="card-scenario">Loading questions from cases.js...</div>

        <ul class="options-list" id="options-list"></ul>

        <div class="rationale-section" id="rationale-box">
            <h4>💡 In-Depth Rationale & Pathophysiology:</h4>
            <p id="card-rationale" style="line-height: 1.6; margin: 0;"></p>
        </div>
    </div>

    <div class="nav-controls">
        <button class="btn" onclick="prevCard()">← Previous</button>
        <span id="progress-indicator" style="font-weight: 600; color: #7f8c8d; font-size: 0.9rem;">0 / 0</span>
        <button class="btn" onclick="nextCard()">Next →</button>
    </div>
</div>

<script>
    let currentIndex = 0;
    let answeredState = {};
    let correctCount = 0;
    let incorrectCount = 0;

    const categoryEl = document.getElementById('card-category');
    const counterEl = document.getElementById('card-counter');
    const scenarioEl = document.getElementById('card-scenario');
    const optionsListEl = document.getElementById('options-list');
    const rationaleBoxEl = document.getElementById('rationale-box');
    const rationaleTextEl = document.getElementById('card-rationale');
    const progressIndicatorEl = document.getElementById('progress-indicator');
    
    const countCorrectEl = document.getElementById('count-correct');
    const countIncorrectEl = document.getElementById('count-incorrect');
    const countAnsweredEl = document.getElementById('count-answered');
    const totalCardsEl = document.getElementById('total-cards');

    // Ensure studyCards loaded successfully from cases.js
    if (typeof studyCards !== 'undefined' && studyCards.length > 0) {
        totalCardsEl.innerText = studyCards.length;
        renderCard();
    } else {
        scenarioEl.innerText = "Error: Could not read cases.js. Make sure cases.js is in the same folder, starts with 'const studyCards = [...]', and has no syntax errors.";
    }

    function renderCard() {
        const card = studyCards[currentIndex];

        categoryEl.innerText = card.category;
        counterEl.innerText = `Card ${currentIndex + 1} of ${studyCards.length}`;
        scenarioEl.innerText = card.scenario;
        rationaleTextEl.innerHTML = card.explanation;

        optionsListEl.innerHTML = '';
        card.options.forEach((option, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = option;

            if (answeredState[currentIndex] !== undefined) {
                li.classList.add('disabled');
                if (index === card.correct) {
                    li.classList.add('correct');
                } else if (index === answeredState[currentIndex]) {
                    li.classList.add('incorrect');
                }
            } else {
                li.onclick = () => selectOption(index, li);
            }

            optionsListEl.appendChild(li);
        });

        if (answeredState[currentIndex] !== undefined) {
            rationaleBoxEl.classList.add('visible');
        } else {
            rationaleBoxEl.classList.remove('visible');
        }

        progressIndicatorEl.innerText = `${currentIndex + 1} / ${studyCards.length}`;
        updateScoreboard();
    }

    function selectOption(selectedIndex, element) {
        if (answeredState[currentIndex] !== undefined) return;

        answeredState[currentIndex] = selectedIndex;
        const card = studyCards[currentIndex];
        
        if (selectedIndex === card.correct) {
            correctCount++;
        } else {
            incorrectCount++;
        }

        const optionItems = optionsListEl.children;
        for (let i = 0; i < optionItems.length; i++) {
            optionItems[i].classList.add('disabled');
            if (i === card.correct) {
                optionItems[i].classList.add('correct');
            } else if (i === selectedIndex) {
                optionItems[i].classList.add('incorrect');
            }
        }

        rationaleBoxEl.classList.add('visible');
        updateScoreboard();
    }

    function updateScoreboard() {
        const totalAnswered = Object.keys(answeredState).length;
        countCorrectEl.innerText = correctCount;
        countIncorrectEl.innerText = incorrectCount;
        countAnsweredEl.innerText = totalAnswered;
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % studyCards.length;
        renderCard();
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + studyCards.length) % studyCards.length;
        renderCard();
    }
</script>

</body>
</html>
